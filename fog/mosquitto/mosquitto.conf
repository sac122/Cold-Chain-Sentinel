# Eclipse Mosquitto configuration for Cold-Chain Sentinel Fog Gateway
# Local (non-TLS) listener — used by simulator, edge, and fog-processor
# running in the same Docker network.

# ── Listeners ─────────────────────────────────────────────────────────────────

# Plain MQTT (internal Docker network only — never expose to public internet)
listener 1883
protocol mqtt

# WebSocket listener (optional — for browser-based debugging)
listener 9001
protocol websockets

# ── Authentication ─────────────────────────────────────────────────────────────
# For local dev/demo: allow anonymous.
# In production, replace with password_file + ACL file.
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file      /mosquitto/config/acl

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# log_type debug   # uncomment for verbose debug

# ── Connection limits ─────────────────────────────────────────────────────────
max_connections 500
max_inflight_messages 40
max_queued_messages 1000

# Note: keep-alive is negotiated per-client during CONNECT handshake.
# There is no broker-side keepalive_interval directive in Mosquitto 2.x.
