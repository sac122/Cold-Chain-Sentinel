# Mosquitto TLS configuration — for production deployments
# Mount certificates into /mosquitto/certs/ in the container.
#
# Generate self-signed certs for testing:
#   openssl req -new -x509 -days 365 -extensions v3_ca \
#     -keyout certs/ca.key -out certs/ca.crt
#   openssl genrsa -out certs/server.key 2048
#   openssl req -new -out certs/server.csr -key certs/server.key
#   openssl x509 -req -in certs/server.csr -CA certs/ca.crt \
#     -CAkey certs/ca.key -CAcreateserial -out certs/server.crt -days 365

listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate false   # set true to require client certs
tls_version tlsv1.2

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
